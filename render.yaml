databases:
  - name: docparser-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: docparser-api
    plan: free
    region: frankfurt
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: >
      bash -c "alembic upgrade head || echo MIGRATION_FAILED;
      python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --timeout-keep-alive 120"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: docparser-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: REDIS_URL
        sync: false
      - key: CELERY_ENABLED
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
      - key: FNS_API_BASE_URL
        value: https://proverkacheka.nalog.ru:9999/v1
      - key: SENTRY_DSN
        sync: false
