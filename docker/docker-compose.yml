version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: docparser-postgres
    environment:
      POSTGRES_USER: docparser
      POSTGRES_PASSWORD: docparser
      POSTGRES_DB: docparser
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docparser"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: docparser-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: docparser-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: docparser-api
    environment:
      DATABASE_URL: postgresql+asyncpg://docparser:docparser@postgres:5432/docparser
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production-min-32-chars
      ENVIRONMENT: development
      DEBUG: "true"
      STRIPE_SECRET_KEY: sk_test_xxx
      STRIPE_PUBLISHABLE_KEY: pk_test_xxx
      STRIPE_WEBHOOK_SECRET: whsec_xxx
      STRIPE_PRICE_STARTER: price_xxx
      STRIPE_PRICE_PRO: price_xxx
      STRIPE_PRICE_BUSINESS: price_xxx
      FNS_API_BASE_URL: https://proverkacheka.nalog.ru:9999/v1
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: docparser-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://docparser:docparser@postgres:5432/docparser
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production-min-32-chars
      ENVIRONMENT: development
      STRIPE_SECRET_KEY: sk_test_xxx
      STRIPE_WEBHOOK_SECRET: whsec_xxx
      FNS_API_BASE_URL: https://proverkacheka.nalog.ru:9999/v1
    volumes:
      - ..:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info --queues=parsing,maintenance

  flower:
    image: mher/flower:latest
    container_name: docparser-flower
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_PORT: 5555
    ports:
      - "5555:5555"
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
  minio_data: