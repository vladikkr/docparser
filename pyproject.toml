# Tooling config only. Runtime dependencies live in requirements.txt,
# which is what Render's Python buildpack uses.

[project]
name = "docparser-ru"
version = "0.1.0"
description = "API для извлечения данных из российских первичных документов"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["S101", "S106", "B008", "E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/migrations/*"]

[tool.alembic]
script_location = "alembic"
